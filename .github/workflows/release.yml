name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    # macOS: the engine's iOS slices need Xcode, and the release builds every platform before it publishes.
    runs-on: macos-latest
    permissions:
      contents: write
      # npm provenance (`publishConfig.provenance`): Yarn signs the publish with the workflow's OIDC token.
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install the NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.1.12297006" > /dev/null

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # `yarn release` builds the engine for every platform, verifies it, builds the packages, publishes each public
      # workspace through Yarn and tags through changesets.
      - name: Create Release Pull Request or Publish to npm
        uses: changesets/action@v1
        with:
          version: yarn changeset:version
          publish: yarn release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
